name: CareFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: careflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://careflow:ci_test_password@localhost:5432/careflow_test
      TEST_DATABASE_URL: postgresql+psycopg://careflow:ci_test_password@localhost:5432/careflow_test
      JWT_SECRET: ci_only_secret_at_least_32_characters_long
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password
      CORS_ORIGINS: '[]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run tests and create JUnit report
        working-directory: backend
        run: pytest -v --junitxml=pytest-results.xml
      - name: Fail if any test skipped
        working-directory: backend
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('pytest-results.xml').getroot(); assert int(r.attrib.get('skipped', 0)) == 0, 'Tests were skipped'"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build

  images:
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Normalize GHCR owner name
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ghcr.io/${{ steps.image.outputs.owner }}/careflow-${{ matrix.component }}:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/careflow-${{ matrix.component }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push scanned image
        run: docker push ghcr.io/${{ steps.image.outputs.owner }}/careflow-${{ matrix.component }}:${{ github.sha }}
