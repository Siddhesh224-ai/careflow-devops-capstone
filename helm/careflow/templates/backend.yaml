apiVersion: v1
kind: Service
metadata:
  name: careflow-backend
  labels: { app: careflow-backend }
spec:
  selector: { app: careflow-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
# The frontend image also runs in Docker Compose, where the API hostname is
# "backend". This alias preserves that hostname inside the careflow namespace
# while careflow-backend remains the canonical Service used by Ingress and
# monitoring.
apiVersion: v1
kind: Service
metadata: { name: backend }
spec:
  selector: { app: careflow-backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: careflow-backend }
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: careflow-backend } }
  template:
    metadata: { labels: { app: careflow-backend } }
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: careflow-config }
            - secretRef: { name: careflow-secrets }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
