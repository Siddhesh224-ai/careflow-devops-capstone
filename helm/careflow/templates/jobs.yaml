apiVersion: batch/v1
kind: Job
metadata:
  name: careflow-migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          command: ["sh", "-c", "until python -c 'from app.db.session import engine; c=engine.connect(); c.close()'; do sleep 5; done; alembic upgrade head"]
          envFrom: [{ configMapRef: { name: careflow-config } }, { secretRef: { name: careflow-secrets } }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: careflow-bootstrap
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "app.bootstrap_admin"]
          envFrom: [{ configMapRef: { name: careflow-config } }, { secretRef: { name: careflow-secrets } }]