apiVersion: v1
kind: Service
metadata: { name: careflow-frontend }
spec:
  selector: { app: careflow-frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: careflow-frontend }
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: careflow-frontend } }
  template:
    metadata: { labels: { app: careflow-frontend } }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}